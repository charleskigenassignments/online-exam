<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Kigen Exam Portal - Secure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #setup { display: flex; justify-content: center; align-items: center; flex: 1; padding: 20px; z-index: 100; }
        .box { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 16px; }
        .btn { background: #238636; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }

        #iframeContainer { display: none; flex: 1; width: 100%; height: calc(100vh - 55px); background: white; }
        iframe { width: 100%; height: 100%; border: none; }

        #statusBar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; padding: 12px 20px; border-top: 1px solid #30363d; z-index: 9999; }
        .status-flex { display: flex; justify-content: space-between; align-items: center; }
        #examTimer { font-family: monospace; font-size: 20px; color: #58a6ff; font-weight: bold; }

        #overlay, #countdownOverlay, #warningOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10001; justify-content: center; align-items: center; flex-direction: column;
            text-align: center; padding: 30px;
        }

        #countdownOverlay { background: rgba(0,0,0,0.95); color: #f85149; }
        #warningOverlay { background: #bc1c1c; color: white; }
        #overlay { background: #000; color: #ff4d4d; border: 10px solid #ff4d4d; }
        .timer-warning { color: #f85149 !important; }
        .acknowledge-btn { background: white; color: #bc1c1c; padding: 15px 40px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; }
        #offlineBanner { display: none; background: #e3b341; color: #000; text-align: center; padding: 5px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="offlineBanner">INTERNET INTERRUPTED - WORK LOCALLY</div>

<div id="setup">
    <div class="box">
        <h2 style="margin-bottom:15px;">Exam Verification</h2>
        <input type="text" id="uName" placeholder="Full Name">
        <input type="text" id="uReg" placeholder="Registration Number">
        <div style="display: flex; gap: 5px;">
            <input type="email" id="uEmail" placeholder="Gmail">
            <button onclick="sendOTP()" id="otpBtn" style="width:90px; height:42px; margin-top:8px; font-size:12px;">Get OTP</button>
        </div>
        <input type="text" id="otpIn" placeholder="4-Digit OTP" style="display:none; text-align:center;">
        <button id="startBtn" class="btn" onclick="syncAndStart()">START EXAM</button>
        <p id="offlineNote" style="font-size: 11px; margin-top: 10px; color: #8b949e; display: none;">No internet? Use code: 0000</p>
    </div>
</div>

<div id="countdownOverlay"><h1 id="countDisp" style="font-size: 80px;">10</h1><h2>RETURN IMMEDIATELY</h2></div>

<div id="warningOverlay">
    <h1>⚠️ STRIKE 1 ISSUED</h1>
    <p>You exited the exam window.<br><br><b>FINAL WARNING:</b> Next switch results in a <b>LOCK</b>.</p>
    <button class="acknowledge-btn" onclick="acknowledgeWarning()">RESUME EXAM</button>
</div>

<div id="iframeContainer"><iframe id="examFrame" src=""></iframe></div>

<div id="statusBar">
    <div class="status-flex">
        <span id="strikeText" style="color:#238636; font-size:12px;">● PROCTORING ACTIVE</span>
        <span id="examTimer">00:00:00</span>
    </div>
</div>

<div id="overlay">
    <h1>SESSION LOCKED</h1>
    <p id="lockReason" style="margin: 20px 0; color: white;">Policy Violation.</p>
    <div style="background: #1a1a1a; padding: 20px; border-radius: 10px; width: 100%; max-width: 350px;">
        <input type="text" id="reKey" placeholder="Instructor Reset Key" style="background:white; color:black;">
        <button onclick="unlock()" class="btn">UNLOCK</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBF_ec8svDceE6RZ-U-z-1JuBe3dyF0zaGmGTO1WKkGO-FrFkZbQ1_wPqHRm1UZkI8/exec";
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScC4wY_cFe4Uh6TiCv9PqzRTRZGQxU557GRLI-7mXNi_HixmQ/viewform?embedded=true&usp=pp_url";

    let state = {
        active: false,
        violations: 0,
        timeLeft: 3600,
        leaveTime: null,
        otp: null,
        masterKey: "1234",
        isWarningVisible: false,
        timerStarted: false,
        listenersAttached: false,  // FIX #8: prevent duplicate event listeners
        vTick: null,               // FIX #5: initialize explicitly
        vTimer: null               // FIX #5: initialize explicitly
    };

    if (!navigator.onLine) document.getElementById('offlineNote').style.display = "block";

    function sendOTP() {
        const email = document.getElementById('uEmail').value;
        if (!email.includes('@')) return alert("Enter valid email");
        document.getElementById('otpBtn').innerText = "...";

        fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(email)}`)
            .then(r => r.text()).then(code => {
                state.otp = code.trim();
                document.getElementById('otpIn').style.display = "block";
                document.getElementById('otpBtn').innerText = "Sent";
            })
            .catch(() => {
                state.otp = "0000";
                document.getElementById('otpIn').style.display = "block";
                document.getElementById('otpBtn').innerText = "Offline";
            });
    }

    async function syncAndStart() {
        const enteredOTP = document.getElementById('otpIn').value;
        const uName = document.getElementById('uName').value;

        if (!uName) return alert("Please enter your name.");
        if (state.otp && enteredOTP !== state.otp && enteredOTP !== "0000") {
            return alert("Invalid OTP. Access Denied.");
        }
        if (!state.otp && enteredOTP !== "0000") {
            return alert("Verification required. Click 'Get OTP' or use backup.");
        }

        try {
            const res = await fetch(`${SCRIPT_URL}?action=getSettings`);
            const data = await res.json();
            state.timeLeft = data.duration * 60;
            state.masterKey = String(data.resetKey); // FIX #7: always store as string
            fetch(`${SCRIPT_URL}?action=login&name=${encodeURIComponent(uName)}&reg=${encodeURIComponent(document.getElementById('uReg').value)}`);
        } catch (e) { console.warn("Offline Start"); }

        document.getElementById('setup').style.display = 'none';
        document.getElementById('iframeContainer').style.display = 'block';
        document.getElementById('statusBar').style.display = 'block';
        document.getElementById('examFrame').src = FORM_URL;

        state.active = true;

        // FIX #8: only attach timer and listeners once
        if (!state.timerStarted) {
            setInterval(updateTimer, 1000);
            state.timerStarted = true;
        }

        if (!state.listenersAttached) {
            document.addEventListener('visibilitychange', onVisibilityChange);
            state.listenersAttached = true;
        }
    }

    // FIX #3/#4: single named handler so it's not duplicated and handles timing correctly
    function onVisibilityChange() {
        if (document.hidden) {
            handleLeave();
        } else {
            handleReturn();
        }
    }

    // FIX #1: proper HH:MM:SS display
    function updateTimer() {
        if (!state.active || state.timeLeft <= 0) return;
        state.timeLeft--;
        const h = Math.floor(state.timeLeft / 3600);
        const m = Math.floor((state.timeLeft % 3600) / 60);
        const s = state.timeLeft % 60;
        const timerDisp = document.getElementById('examTimer');
        timerDisp.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        if (state.timeLeft < 300) timerDisp.classList.add('timer-warning');
        if (state.timeLeft === 0) lockExam("Time Expired");
    }

    function handleLeave() {
        // FIX #2/#4: no delayed setTimeout; check state directly and set leaveTime immediately
        if (!state.active || state.leaveTime !== null || state.isWarningVisible) return;
        state.leaveTime = Date.now();

        let limit = state.violations === 0 ? 10 : 5;
        document.getElementById('countdownOverlay').style.display = 'flex';
        let count = limit;
        document.getElementById('countDisp').innerText = count;

        // FIX #5: use state.vTick / state.vTimer (already initialized on state)
        state.vTick = setInterval(() => {
            count--;
            document.getElementById('countDisp').innerText = count > 0 ? count : 0;
            if (count <= 0) clearInterval(state.vTick);
        }, 1000);

        state.vTimer = setTimeout(() => { triggerStrike(); }, limit * 1000 + 500);
    }

    function handleReturn() {
        // FIX #4: guard on leaveTime being non-null (set immediately in handleLeave now)
        if (!state.active || state.leaveTime === null) return;
        clearInterval(state.vTick);
        clearTimeout(state.vTimer);
        state.vTick = null;
        state.vTimer = null;
        document.getElementById('countdownOverlay').style.display = 'none';
        state.leaveTime = null;
    }

    function triggerStrike() {
        state.violations++;
        handleReturn();
        if (state.violations === 1) {
            state.isWarningVisible = true;
            document.getElementById('iframeContainer').style.display = 'none';
            document.getElementById('statusBar').style.display = 'none';
            document.getElementById('warningOverlay').style.display = 'flex';
            document.getElementById('strikeText').innerText = "● SECURITY: 1 STRIKE";
            document.getElementById('strikeText').style.color = "#ff4d4d";
        } else {
            lockExam("Repeated Window Switch");
        }
    }

    function acknowledgeWarning() {
        state.isWarningVisible = false;
        document.getElementById('warningOverlay').style.display = 'none';
        document.getElementById('iframeContainer').style.display = 'block';
        document.getElementById('statusBar').style.display = 'block';
    }

    function lockExam(reason) {
        state.active = false;
        document.getElementById('iframeContainer').style.display = 'none';
        document.getElementById('statusBar').style.display = 'none';
        document.getElementById('warningOverlay').style.display = 'none';
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('lockReason').innerText = reason;
        // FIX #6: added action=violation parameter so Apps Script can route correctly
        if (navigator.onLine) {
            fetch(`${SCRIPT_URL}?action=violation&name=${encodeURIComponent(document.getElementById('uName').value)}&violation=${encodeURIComponent(reason)}`);
        }
    }

    function unlock() {
        // FIX #7: strict string comparison (masterKey is now always stored as string)
        if (document.getElementById('reKey').value === state.masterKey) {
            state.active = true;
            state.violations = 0;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('statusBar').style.display = 'block';
            document.getElementById('iframeContainer').style.display = 'block';
            document.getElementById('strikeText').innerText = "● MONITORING ACTIVE (RESET)";
            document.getElementById('strikeText').style.color = "#238636";
        } else {
            alert("Invalid Reset Key");
        }
    }

    window.addEventListener('offline', () => {
        document.getElementById('offlineBanner').style.display = "block";
        document.getElementById('strikeText').innerText = "● OFFLINE MODE";
    });

    window.addEventListener('online', () => {
        document.getElementById('offlineBanner').style.display = "none";
        document.getElementById('strikeText').innerText = "● PROCTORING ACTIVE";
    });
</script>
</body>
</html>
